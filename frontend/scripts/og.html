<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      background: #050a14;
      color: #fff;
      font-family: "Segoe UI", sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      gap: 48px;
      padding: 72px;
      box-sizing: border-box;
      background:
        radial-gradient(circle at 12% 18%, rgba(0, 229, 255, 0.18), transparent 32%),
        radial-gradient(circle at 88% 12%, rgba(156, 39, 176, 0.22), transparent 34%),
        #050a14;
    }
    img { width: 200px; height: 200px; object-fit: contain; }
    h1 { font-size: 72px; line-height: 1; margin: 0 0 18px; }
    p { font-size: 32px; color: #00e5ff; margin: 0; }
  </style>
</head>
<body>
  <img src="../public/logo.png" alt="">
  <div>
    <h1>SynapseDevs</h1>
    <p>Code. Connect. Create.</p>
  </div>
</body>
</html>
