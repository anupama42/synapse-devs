<article class="row">
  @if (project.liveUrl) {
    <a
      class="thumb"
      [href]="project.liveUrl"
      target="_blank"
      rel="noopener"
      [attr.aria-label]="openLabel()"
    >
      <img [src]="thumbnailSrc" [alt]="altLabel()" width="1440" height="900" loading="lazy" decoding="async" />
    </a>
  } @else {
    <div class="thumb">
      <img [src]="thumbnailSrc" [alt]="altLabel()" width="1440" height="900" loading="lazy" decoding="async" />
    </div>
  }
  <div class="copy">
    <p class="cat">{{ text('category') }}</p>
    <h3>{{ project.name }}</h3>
    <p>{{ text('shortDescription') }}</p>
    @if (project.description) {
      <p class="desc">{{ text('description') }}</p>
    }
    <div class="tags">
      @for (tag of project.techStack; track tag) {
        <span>{{ tag }}</span>
      }
    </div>
  </div>
</article>
