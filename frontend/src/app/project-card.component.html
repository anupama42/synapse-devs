<article class="row">
  @if (project.liveUrl) {
    <a
      class="thumb"
      [href]="project.liveUrl"
      target="_blank"
      rel="noopener"
      [attr.aria-label]="'Open live site: ' + project.name"
    >
      <img [src]="thumbnailSrc" [alt]="project.name + ' landing page'" />
    </a>
  } @else {
    <div class="thumb">
      <img [src]="thumbnailSrc" [alt]="project.name + ' preview'" />
    </div>
  }
  <div class="copy">
    <p class="cat">{{ project.category }}</p>
    <h3>{{ project.name }}</h3>
    <p>{{ project.shortDescription }}</p>
    @if (project.description) {
      <p class="desc">{{ project.description }}</p>
    }
    <div class="tags">
      @for (tag of project.techStack; track tag) {
        <span>{{ tag }}</span>
      }
    </div>
  </div>
</article>
