<div class="shell">
  <div class="neural" aria-hidden="true"></div>
  <header class="nav">
    <a routerLink="/" class="brand" (click)="closeMenu()">
      <img src="/logo.png" alt="SynapseDevs" width="168" height="168" />
    </a>
    <button
      class="menu-btn"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      aria-controls="site-menu"
    >
      {{ menuOpen ? 'Close' : 'Menu' }}
    </button>
    <nav id="site-menu" class="menu-panel" [class.open]="menuOpen">
      @for (link of links; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: link.exact }">{{
          link.label
        }}</a>
      }
    </nav>
  </header>
  @if (menuOpen) {
    <button class="scrim" type="button" aria-label="Close menu" (click)="closeMenu()"></button>
  }
  <main>
    <router-outlet />
  </main>
  <footer class="foot">
    <p>SynapseDevs · Code. Connect. Create.</p>
    @if (data$ | async; as data) {
      <p class="muted">
        <a [href]="'mailto:' + data.site.email">{{ data.site.email }}</a>
        ·
        <a [href]="data.site.instagram" target="_blank" rel="noopener">&#64;{{ data.site.instagramHandle }}</a>
      </p>
    }
    <p class="muted">Two-person full-stack team · web &amp; mobile</p>
  </footer>
</div>
