<section class="wrap">
  <p class="eyebrow">Work</p>
  <h1>Live projects</h1>
  <p class="lede">
    Sites we have shipped. The list can grow — each entry is a name, what it does, the stack, and a preview of the live site.
  </p>
  <div class="list">
    @for (project of projects$ | async; track project.slug) {
      <app-project-card [project]="project" />
    }
  </div>
</section>
