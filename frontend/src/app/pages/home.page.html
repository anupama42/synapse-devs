@if (site$ | async; as data) {
  <section class="hero">
    <p class="eyebrow">Full-stack duo · live work only</p>
    <h1>
      <span class="white">We build the product.</span><br />
      <span class="grad">Then we put it on the internet.</span>
    </h1>
    <p class="lead">{{ data.site.valueProposition }}</p>
    <div class="actions">
      <a class="btn" routerLink="/work">See proof of work</a>
      <a class="btn ghost" routerLink="/contact">Start a conversation</a>
    </div>
  </section>
}

<section class="wrap">
  <div class="section-head">
    <h2>Featured</h2>
    <a routerLink="/work">Full grid →</a>
  </div>
  <div class="grid-2">
    @for (project of featured$ | async; track project.slug) {
      <app-project-card [project]="project" />
    }
  </div>
</section>
