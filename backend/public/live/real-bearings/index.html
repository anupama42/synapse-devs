<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Real Bearings — B2B catalog</title>
  <style>
    body { margin: 0; font-family: Segoe UI, sans-serif; background: #140f08; color: #fff6e8; }
    header { padding: 48px 24px; background: linear-gradient(135deg, #3e2723, #1a1208); }
    main { max-width: 720px; margin: 0 auto; padding: 32px 24px; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { border: 1px solid #ffb74d; padding: 6px 12px; border-radius: 999px; font-size: 13px; }
    .card { border: 1px solid #4a3b22; border-radius: 16px; padding: 20px; margin: 16px 0; }
    a { color: #ffb74d; }
  </style>
</head>
<body>
  <header>
    <p>B2B catalog · enquiry first</p>
    <h1>Real Bearings</h1>
    <p>Industrial bearings with specs, MOQ, and WhatsApp enquiry — no cart.</p>
  </header>
  <main>
    <div class="filters">
      <span class="chip">Brand</span><span class="chip">Type</span><span class="chip">Discount</span>
    </div>
    <div class="card">
      <h2>6206-2RS</h2>
      <p>Chrome steel · MOQ 10 · Deep groove ball bearing</p>
      <p>Enquire on WhatsApp instead of checkout — the B2B pattern this site was built to prove.</p>
    </div>
  </main>
</body>
</html>
